# hhu-vpn-agent 配置示例：复制为 config.ini 后填写。
# 这份文件与上游 hhu-autologin 的 config.ini 兼容——同一个文件既能给上游守护用，
# 也能给 hhuvpn 连接器用，所以不要再维护两份账号。
#
# 【重要】校园网（ePortal 认证）与学校 WebVPN（统一身份认证/CAS）用的是**同一个账号**：
#        同一套学号 + 同一个信息门户密码。所以只需要在下面 [account] 里填一次，
#        两处登录都用它；改密码时也只改这一处。
#        因此插件还有个行为：校园网那边因密码错被拒时，不会再拿同一份密码去撞 WebVPN
#        （避免失败次数翻倍、把账号推进验证码）。

[account]
; 学号 / 工号（校园网 ePortal 与 WebVPN 统一身份认证：同一个账号）
username =
; 信息门户密码。留空也可以：用「hhuvpn config set-password」写 DPAPI 加密凭据，
; 或临时用环境变量 HHU_USERNAME / HHU_PASSWORD（不落盘，最安全）。
password =
; 校园网运营商服务关键词：校园网 / 移动 / 电信 / 联通（按关键词匹配登录页选项）
service = 校园网

[campus]
enabled = true
; 在线判定探针（未认证时校园网会劫持 http，拿不到 204）
probe_url = http://connect.rom.miui.com/generate_204
eportal_host = http://eportal.hhu.edu.cn
; 只在指定 WiFi 下自动登录（多个用逗号分隔）；留空 = 不检查，有线连接请留空
wifi_ssid = Hohai University

[webvpn]
enabled = true
base_url = https://webvpn.hhu.edu.cn
; auto = 先严格校验 TLS，失败后降级并告警；true = 必须校验；false = 不校验
tls_verify = auto
; 本地会话缓存时长（分钟）
session_ttl_minutes = 120
; WebVPN 采用「按需开启 + 开着就保活」：
;   - 守护不会主动登录 WebVPN；真正的开启只有 vpn on / ensure / open / login webvpn；
;   - 一旦开启，keepalive = true（默认）时由守护负责续期，
;     直到使用者 vpn off 或关机——"不主动开，但开着就别掉"。
keepalive = true
; 本次开机后的第一次守护运行先关掉 WebVPN（远端注销 + 清本地会话 + 复位开启意图），
; 保证"关机后到下次开机前都是关的"，直到使用者明确要用。
close_on_boot = true

[databases]
; ensure 不带 --db 时校验这些库（别名见「hhuvpn db list」）
default = sd,cnki
; 判定「已用学校身份登录」时匹配的机构名，多个用 | 分隔
institution = 河海大学|Hohai University

[agent]
; 状态目录（会话 cookie / 校准指纹 / 日志）；留空 = 项目下 state/
state_dir =
json_pretty = true
retries = 1

[guard]
; 仅上游 hhu_login.py 守护读取
interval_minutes = 1
auto_exit_after_login = false
auto_exit_minutes = 0

[notify]
enabled = true
on_success = true
on_failure = true
failure_cooldown_minutes = 30

[advanced]
debug = true
